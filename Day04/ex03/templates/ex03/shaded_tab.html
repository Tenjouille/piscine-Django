<!DOCTYPE html>
<html lang="en-US">
	<head>
		<meta charset="utf-8" />
		<title>RainTab</title>
		<style>
			th, td {
				height: 40px;
				width: 80px;
			}
		</style>
	</head>
	<body>
		<table>
			<tr>
				<th>Noir</th>
				<th>Rouge</th>
				<th>Bleu</th>
				<th>Vert</th>
			</tr>
			{% for rgb_value in rgb_scope %}
				<tr>
					<td style="background-color: {{ rgb_value.noir }};"></td>
					<td style="background-color: {{ rgb_value.rouge }};"></td>
					<td style="background-color: {{ rgb_value.bleu }};"></td>
					<td style="background-color: {{ rgb_value.vert }};"></td>
				</tr>
			{% endfor %}
		</table>
	</body>
</html>
